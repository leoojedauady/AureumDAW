<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aureum Bank - Movimientos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>AUREUM BANK</h1>
    <nav>
      <a href="movimientos.html">Movimientos</a>
      <a href="comprobantes.html">Comprobantes</a>
      <a href="divisas.html">Divisas</a>
      <a href="#" id="salir">Cerrar sesión</a>
    </nav>
  </header>

  <main>
    <div class="caja">
      <h2 id="saludo">Hola</h2>
      <p id="ultimaVisita"></p>
      <p>Saldo actual:</p>
      <p class="saldo" id="saldo">$0.00</p>
    </div>

    <div class="caja no-imprimir">
      <h2 id="tituloFormulario">Agregar movimiento</h2>

      <form id="formMovimiento">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha" required>

        <label for="descripcion">Descripción</label>
        <input type="text" id="descripcion" name="descripcion" maxlength="50" required>

        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria"></select>

        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo">
          <option value="ingreso">Ingreso</option>
          <option value="gasto">Gasto</option>
        </select>

        <label for="monto">Monto</label>
        <input type="number" id="monto" name="monto" min="1" step="0.01" required>

        <p id="mensaje" class="mensaje"></p>

        <button type="submit" id="botonGuardar">Guardar</button>
      </form>
    </div>

    <div class="caja">
      <h2>Mis movimientos</h2>

      <div class="no-imprimir">
        <label for="buscar">Buscar</label>
        <input type="text" id="buscar" placeholder="Escribe una descripción">
        <button type="button" id="botonImprimir">Imprimir</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Descripción</th>
            <th>Categoría</th>
            <th>Monto</th>
            <th class="no-imprimir">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
  </main>

  <script src="js/sesion.js"></script>
  <script src="js/movimientos.js"></script>
</body>
</html>
